<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="330" viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layer stack: test files import common.flow, which imports mycore.rules. FLOW reads each file once." style="font-family:system-ui,-apple-system,'Segoe UI',sans-serif">
<defs><marker id="a2ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<rect width="760" height="330" rx="18" fill="#0f172a"/>
<text x="30" y="38" fill="#94a3b8" font-size="12" letter-spacing="3">HOW THE FILES STACK</text>
<g>
<rect x="30" y="56" width="470" height="62" rx="12" fill="#134e4a" stroke="#14b8a6" stroke-width="2"/>
<text x="52" y="82" fill="#f1f5f9" font-size="15" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">test1.flow … testN.flow</text>
<text x="52" y="102" fill="#99f6e4" font-size="12">One scenario per file · directed + random + assertions</text>
