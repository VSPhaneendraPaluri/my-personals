<text x="52" y="166" fill="#f1f5f9" font-size="15" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">common.flow</text>
<text x="52" y="186" fill="#ddd6fe" font-size="12">Pools · defaults · init state · hooks · scenes (library, no tests)</text>
<rect x="30" y="224" width="470" height="62" rx="12" fill="#78350f" stroke="#f59e0b" stroke-width="2"/>
<text x="52" y="250" fill="#f1f5f9" font-size="15" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">mycore.rules</text>
<text x="52" y="270" fill="#fde68a" font-size="12">Architectural legality · enforced at generation time</text>
</g>
<path d="M502 87 H560 V171 H506" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#a2ar)"/>
