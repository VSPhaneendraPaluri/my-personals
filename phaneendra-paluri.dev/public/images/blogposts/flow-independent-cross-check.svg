<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Independent readings create a meaningful cross-check</title>
  <desc id="desc">Two separate readings of the specification lead to independent generator and simulator architecture models, then their outcomes are compared.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2c"/>
      <stop offset="1" stop-color="#111321"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7287a5"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .muted { fill: #9aacc4; }
    </style>
  </defs>
  <rect width="1200" height="590" rx="30" fill="url(#bg)"/>
  <circle cx="1070" cy="50" r="185" fill="#a78bfa" opacity=".05"/>
  <text x="62" y="70" fill="#73e0d0" font-size="16" font-weight="700" letter-spacing="3">INDEPENDENCE IS A PROCESS, NOT JUST A CODE PROPERTY</text>
  <text x="62" y="118" fill="#f3f6fc" font-size="32" font-weight="700">Read separately. Model separately. Compare explicitly.</text>

  <rect x="424" y="155" width="352" height="85" rx="19" fill="#26334a" stroke="#7c91b0" stroke-width="1.5"/>
  <text x="600" y="190" fill="#f3f6fc" font-size="20" font-weight="700" text-anchor="middle">Architecture specification</text>
  <text x="600" y="216" class="muted" font-size="15" text-anchor="middle">The shared source to interpret</text>

  <path d="M515 241 C470 270 333 265 301 313" fill="none" stroke="#50d1bc" stroke-width="2.5" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <path d="M685 241 C730 270 867 265 899 313" fill="none" stroke="#b99bff" stroke-width="2.5" stroke-dasharray="7 8" marker-end="url(#arrow)"/>
  <text x="362" y="276" fill="#73e0d0" font-size="14" font-weight="700" text-anchor="middle">SEPARATE READING A</text>
  <text x="838" y="276" fill="#c7b2ff" font-size="14" font-weight="700" text-anchor="middle">SEPARATE READING B</text>

  <rect x="92" y="326" width="416" height="128" rx="20" fill="#15343a" stroke="#50d1bc" stroke-width="1.7"/>
  <circle cx="133" cy="366" r="9" fill="#50d1bc"/>
  <text x="157" y="373" fill="#f3f6fc" font-size="21" font-weight="700">Generator model</text>
  <text x="128" y="411" class="muted" font-size="16">Constrains generated instruction streams</text>
  <text x="128" y="436" fill="#74dfcf" font-size="14" font-weight="700">INDEPENDENT INTERPRETATION</text>

  <rect x="692" y="326" width="416" height="128" rx="20" fill="#28233d" stroke="#b99bff" stroke-width="1.7"/>
  <circle cx="733" cy="366" r="9" fill="#b99bff"/>
  <text x="757" y="373" fill="#f3f6fc" font-size="21" font-weight="700">Simulator model</text>
  <text x="728" y="411" class="muted" font-size="16">Checks legality and architectural behavior</text>
  <text x="728" y="436" fill="#c7b2ff" font-size="14" font-weight="700">INDEPENDENT INTERPRETATION</text>

  <path d="M300 456 V493 H600" fill="none" stroke="#50d1bc" stroke-width="2"/>
  <path d="M900 456 V493 H600" fill="none" stroke="#b99bff" stroke-width="2"/>
  <path d="M600 493 V511" fill="none" stroke="#e4bd68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="398" y="519" width="404" height="48" rx="24" fill="#3b3427" stroke="#e4bd68" stroke-width="1.3"/>
  <text x="600" y="549" fill="#ffe7a3" font-size="16" font-weight="700" text-anchor="middle">COMPARE OUTCOMES · INVESTIGATE DISAGREEMENT</text>
</svg>
